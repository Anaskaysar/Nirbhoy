# Render Blueprint: https://render.com/docs/blueprint-spec
# Free web service. The disk is temporary, so every start re-creates the
# database with clean demo data (migrate + seed_demo).
services:
  - type: web
    name: nirbhoy-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && cd backend && python manage.py collectstatic --noinput
    startCommand: cd backend && python manage.py migrate --noinput && python manage.py seed_demo && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: nirbhoy.kaysarulanas.me,.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://nirbhoy.kaysarulanas.me,https://*.onrender.com
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      - key: RECEIPT_HASH_KEY
        generateValue: true
